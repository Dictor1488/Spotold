name: Build INQ SPOT prerelease
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python 2.7
        shell: pwsh
        run: choco install python2 -y --no-progress
      - name: Build .wotmod
        shell: pwsh
        run: python build.py --python27 "C:\Python27\python.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: INQ-SPOT-wotmod
          path: dist/*.wotmod
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wotmod
          prerelease: true
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', '0.3.0-beta.1') || github.ref_name }}
          target_commitish: ${{ github.sha }}
